# nginx: проксує календарні посилання бота (/cal/...) на вбудований вебсервер.
# Замініть DOMAIN на свій (напр. philad.duckdns.org), HTTPS додасть certbot:
#   sudo certbot --nginx -d DOMAIN
server {
    listen 80;
    server_name DOMAIN;

    location /cal/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }
}
